# Netlify publishes the practice-only public build (no backend, admin dashboard or private data).
# Every push to main redeploys; pull requests get preview links.
[build]
  command = "npm install --global esbuild@0.25.0 && python3 scripts/build_public.py --minify"
  publish = "_site"

[build.environment]
  NODE_VERSION = "22"
  PYTHON_VERSION = "3.12"

[[headers]]
  for = "/models/*.glb"
  [headers.values]
    Content-Type = "model/gltf-binary"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Browsers check for a new service worker on each visit; never let a CDN or proxy hold an old one.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
