name: Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Backend tests
        run: python -m unittest discover -s backend -p 'test_*.py'
      - name: Model and experiment tests
        run: |
          node tests/model-geometry.mjs
          node tests/anatomy-motion.mjs
          node tests/experiment-model.mjs
      - name: Public build
        run: python scripts/build_public.py
