name: Deploy Cellscape to GitHub Pages
on:
  # Manual publishing of the practice-only frontend. Private backend files are excluded.
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Prepare public files (minified)
        run: |
          npm install -g esbuild@0.25.0
          python3 scripts/build_public.py --minify
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
